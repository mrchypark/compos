[workspace]
members = [
    "crates/compos-operator",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
getrandom = "0.3"
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kube = { version = "4", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
