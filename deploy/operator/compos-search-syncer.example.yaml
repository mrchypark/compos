apiVersion: compos.mrchypark.dev/v1alpha1
kind: ComposSearchSyncer
metadata:
  name: compos-search
spec:
  compos:
    endpoint: http://compos:7878
    workspaceId: wks_replace_me
    authSecretRef:
      name: compos-search-auth
      key: token
  syncer:
    # Replace with the GAR tag printed by the build-images workflow.
    image: REGISTRY_HOST/PROJECT/REPOSITORY/compos-search-syncer:YYYYMMDD-SHORT_SHA
