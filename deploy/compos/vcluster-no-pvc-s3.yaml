# vcluster validation fixture for three Hiqlite peers without PVCs.
# RustFS here is only a local S3-compatible backup target. In production, point
# HQL_S3_URL at object storage outside the Kubernetes/vcluster failure domain.
apiVersion: v1
kind: Namespace
metadata:
  name: compos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: compos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.8
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: compos-env
                  key: HQL_S3_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: compos-env
                  key: HQL_S3_SECRET
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
              value: "true"
            - name: RUSTFS_VOLUMES
              value: /data/rustfs{0...3}
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: compos
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: compos
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rc
          image: rustfs/rc:v0.1.25
          envFrom:
            - secretRef:
                name: compos-env
          command:
            - /bin/sh
            - -c
            - |
              until rc alias set local "$HQL_S3_URL" "$HQL_S3_KEY" "$HQL_S3_SECRET"; do
                sleep 2
              done
              rc mb --ignore-existing "local/$HQL_S3_BUCKET"
---
apiVersion: v1
kind: Service
metadata:
  name: compos-headless
  namespace: compos
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: compos
  ports:
    - name: http
      port: 7878
      targetPort: http
    - name: raft
      port: 8100
      targetPort: raft
    - name: api
      port: 8200
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: compos
  namespace: compos
spec:
  selector:
    app: compos
  ports:
    - name: http
      port: 7878
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compos
  namespace: compos
spec:
  serviceName: compos-headless
  replicas: 3
  selector:
    matchLabels:
      app: compos
  template:
    metadata:
      labels:
        app: compos
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-bucket
          image: rustfs/rc:v0.1.25
          envFrom:
            - secretRef:
                name: compos-env
          command:
            - /bin/sh
            - -c
            - |
              until rc alias set local "$HQL_S3_URL" "$HQL_S3_KEY" "$HQL_S3_SECRET" &&
                (rc ls "local/$HQL_S3_BUCKET" >/dev/null 2>&1 || rc mb --ignore-existing "local/$HQL_S3_BUCKET"); do
                sleep 2
              done
      containers:
        - name: compos-server
          image: compos-server:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: compos-env
          ports:
            - name: http
              containerPort: 7878
            - name: raft
              containerPort: 8100
            - name: api
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
