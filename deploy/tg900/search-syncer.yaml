apiVersion: apps/v1
kind: Deployment
metadata:
  name: compos-search-syncer
  namespace: compos-conductor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: compos-search-syncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compos-search-syncer
        app.kubernetes.io/part-of: compos-conductor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: syncer
          image: registry.example.invalid/compos/compos-search-syncer@sha256:d46677183899eca0e9338c6c2763ca8f7a3c5134a52e1c5725a44d6446f49fbc
          env:
            - name: COMPOS_ENDPOINT
              value: http://compos:7878
            # Omitted workspace ID: discover the token's scoped workspace each cycle.
            - name: COMPOS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compos-syncer-auth
                  key: compos-token
            - name: MEILISEARCH_URL
              value: http://meilisearch.compos.svc.cluster.local:7700
            - name: MEILISEARCH_INDEX_UID
              value: compos-tg900-objects
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compos-syncer-auth
                  key: meilisearch-write-key
            - name: SYNC_INTERVAL_SECONDS
              value: "5"
            - name: SYNC_BATCH_SIZE
              value: "100"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
