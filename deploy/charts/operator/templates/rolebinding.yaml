apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compos-operator
  labels:
    app.kubernetes.io/name: compos-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: compos-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compos-operator
