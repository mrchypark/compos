name: test compos

on:
  push:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile"
      - ".github/workflows/server-ghcr.yaml"
      - ".github/workflows/server-binaries.yaml"
      - ".github/workflows/test.yaml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Shell syntax
        run: find scripts -name '*.sh' -exec sh -c 'for script do echo "$script"; sh -n "$script" || exit 1; done' sh {} +

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Validate GitHub workflows and storage gate
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/test.yaml .github/workflows/server-ghcr.yaml .github/workflows/server-binaries.yaml
          sh scripts/release/storage-gate-test.sh
          sh scripts/release/ha-quorum-gate-test.sh
          sh scripts/release/server-binary-checksums-test.sh
          sh scripts/release/tag-protection-test.sh

      - name: Docker Go version
        run: |
          grep -Fx "FROM golang:$(sed -n 's/^go //p' go.mod)-trixie AS go-build" Dockerfile

      - name: Go test
        run: go test ./...

      - name: Go user journey
        run: ./scripts/e2e-user-journey.sh

      - name: Go vet
        run: go vet ./...

  rhiza-cluster:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Rhiza three-node failure and recovery
        run: ./scripts/e2e-rhiza-cluster.sh
