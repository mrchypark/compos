name: test compos

on:
  push:
    paths: &test_paths
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "tools/rhiza-v012-export/**"
      - "scripts/**"
      - "deploy/**"
      - "docs/**"
      - "Dockerfile"
      - ".github/workflows/build-images.yaml"
      - ".github/workflows/publish-cli.yaml"
      - ".github/workflows/test.yaml"
  pull_request:
    paths: *test_paths

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Write image path gate
        if: github.event_name == 'push'
        shell: sh
        run: |
          {
            echo "before=${{ github.event.before }}"
            echo "after=${{ github.event.after }}"
            echo "base=${{ github.event.before }}"
            echo "head=${{ github.event.after || github.sha }}"
          } > image-path-gate.env

      - name: Upload image path gate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-path-gate
          path: image-path-gate.env
          if-no-files-found: error
          retention-days: 1

      - name: Shell syntax
        run: find scripts -name '*.sh' -exec sh -c 'for script do echo "$script"; sh -n "$script" || exit 1; done' sh {} +

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.2

      - name: Helm chart
        run: |
          helm lint deploy/charts/operator
          helm template compos-operator deploy/charts/operator --include-crds >/dev/null

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Docker Go version
        run: |
          grep -Fx "FROM golang:$(sed -n 's/^go //p' go.mod)-trixie AS go-build" Dockerfile

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.1

      - name: Go test
        run: go test ./...

      - name: Go user journey
        run: ./scripts/e2e-user-journey.sh

      - name: Go vet
        run: go vet ./...

      - name: Legacy logical export
        working-directory: tools/rhiza-v012-export
        run: go test ./... && go vet ./...

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust operator test
        run: cargo test --locked --workspace --all-targets

      - name: Generated SearchSyncer CRD
        run: |
          cargo run --quiet --bin compos-operator -- --print-cluster-crd > /tmp/clusters.compos.mrchypark.dev.yaml
          diff -u deploy/charts/operator/crds/clusters.compos.mrchypark.dev.yaml /tmp/clusters.compos.mrchypark.dev.yaml
          cargo run --quiet --bin compos-operator -- --print-search-syncer-crd > /tmp/searchsyncers.compos.mrchypark.dev.yaml
          diff -u deploy/charts/operator/crds/searchsyncers.compos.mrchypark.dev.yaml /tmp/searchsyncers.compos.mrchypark.dev.yaml

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rhiza-cluster:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Rhiza three-node failure and recovery
        run: ./scripts/e2e-rhiza-cluster.sh
