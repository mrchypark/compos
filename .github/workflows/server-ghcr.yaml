name: verify and publish server GHCR

on:
  push:
    branches: ['feature/**']
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/server/**'
      - 'internal/**'
      - 'Dockerfile'
      - 'scripts/release/**'
      - '.github/workflows/server-ghcr.yaml'
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested server image after all gates pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Four-provider recovery and replay
        run: sh scripts/release/storage-gate-floci.sh recovery-results recovery
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-recovery-${{ github.sha }}
          path: recovery-results/
          if-no-files-found: warn

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and verification limits
        shell: sh
        run: |
          mkdir -p release-results
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > release-results/source-sha.txt
          printf '%s\n' 'Upstream authentication gateway integration is not covered.' \
            'Single-voter storage gates test archive recovery, replay, and process-termination recovery on filesystem and emulators; they do not enforce single-writer deployment or stale-writer fencing.' \
            'Production prerequisite: deployment must ensure one writer for a single-voter or Local namespace and stop the prior process and outstanding operations before replacement; async writes can be lost before archival.' \
            > release-results/coverage.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate storage gate fixtures
        run: |
          sh scripts/release/storage-gate-test.sh
          sh scripts/release/ha-quorum-gate-test.sh
      - name: Required HA quorum-loss recovery
        run: sh scripts/release/ha-quorum-gate.sh release-results
      - name: Go tests including typed queries and credential-free HTTP
        run: go test -json -count=1 -timeout=20m ./... > release-results/go-tests.jsonl 2>&1
      - name: Required single-node recovery, replay and process termination
        run: sh scripts/release/storage-gate-floci.sh release-results
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-verification-${{ github.sha }}
          path: release-results/
          if-no-files-found: error

  image:
    # Run image diagnostics even when the separate storage gate is blocked.
    if: ${{ always() && !cancelled() }}
    needs: [verify, recovery]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Image identity
        shell: sh
        run: |
          mkdir -p release-results
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):sha-$GITHUB_SHA-${{ matrix.arch }}"
          echo "SERVER_IMAGE=$image" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > release-results/source-sha.txt
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build server only and load before smoke
        shell: sh
        run: |
          docker buildx build --target server --platform "${{ matrix.platform }}" --load \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$SERVER_IMAGE" --metadata-file release-results/build.json .
          docker image inspect "$SERVER_IMAGE" > release-results/image.json
      - name: Health, workspace and Person image smoke
        run: sh scripts/release/server-smoke.sh "$SERVER_IMAGE" release-results
      - name: Login to GHCR
        if: inputs.publish && needs.verify.result == 'success' && needs.recovery.result == 'success'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exactly the smoke-tested image
        if: inputs.publish && needs.verify.result == 'success' && needs.recovery.result == 'success'
        shell: sh
        run: |
          docker push "$SERVER_IMAGE" > release-results/push.log 2>&1
          cat release-results/push.log
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$SERVER_IMAGE" > release-results/repo-digests.txt
          grep -E '^ghcr.io/.+@sha256:[a-f0-9]{64}$' release-results/repo-digests.txt
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-${{ matrix.arch }}-${{ github.sha }}
          path: release-results/
          if-no-files-found: error

  image-manifest:
    if: inputs.publish && needs.verify.result == 'success' && needs.recovery.result == 'success' && needs.image.result == 'success'
    needs: [verify, recovery, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image-amd64-${{ github.sha }}
          path: release-results/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image-arm64-${{ github.sha }}
          path: release-results/arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch manifest from smoke-tested digests
        shell: sh
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):sha-$GITHUB_SHA"
          amd64_digest=$(grep -m1 -E '^ghcr.io/.+@sha256:[a-f0-9]{64}$' release-results/amd64/repo-digests.txt)
          arm64_digest=$(grep -m1 -E '^ghcr.io/.+@sha256:[a-f0-9]{64}$' release-results/arm64/repo-digests.txt)
          docker buildx imagetools create -t "$image" "$amd64_digest" "$arm64_digest"
          docker buildx imagetools inspect "$image" > release-results/manifest.txt
          cat release-results/manifest.txt
      - name: Upload manifest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-manifest-${{ github.sha }}
          path: release-results/manifest.txt
          if-no-files-found: warn
