name: verify server binaries

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/server/**'
      - 'internal/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_LICENSES.txt'
      - '.github/workflows/server-binaries.yaml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "composd-$env:GOOS-$env:GOARCH"
          $binary = if ($env:GOOS -eq 'windows') { 'composd.exe' } else { 'composd' }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -ne $env:GITHUB_SHA) { throw 'checkout does not match workflow SHA' }
          New-Item -ItemType Directory -Path package, dist | Out-Null
          go build -trimpath -ldflags='-s -w' -o "package/$binary" ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt package/
          Get-Item package, package/* | ForEach-Object { $_.LastWriteTimeUtc = [DateTime]::new(2000, 1, 1, 0, 0, 0, [DateTimeKind]::Utc) }
          if ($env:GOOS -eq 'windows') {
            $archive = "$name.zip"
            Compress-Archive -Path package/* -DestinationPath "dist/$archive"
          } else {
            $archive = "$name.tar.gz"
            tar -czf "dist/$archive" -C package .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
          "$((Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower())  $archive" | Set-Content -Encoding ascii "dist/$name.sha256"
          $source | Set-Content -Encoding ascii "dist/$name.source"
      - name: Smoke test extracted archive
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "composd-$env:GOOS-$env:GOARCH"
          $binary = if ($env:GOOS -eq 'windows') { 'composd.exe' } else { 'composd' }
          New-Item -ItemType Directory -Path extracted, smoke | Out-Null
          if ($env:GOOS -eq 'windows') {
            Expand-Archive "dist/$name.zip" extracted
          } else {
            tar -xzf "dist/$name.tar.gz" -C extracted
            if ($LASTEXITCODE -ne 0) { throw 'archive extraction failed' }
          }
          foreach ($file in $binary, 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.txt') {
            if (!(Test-Path "extracted/$file")) { throw "archive missing $file" }
          }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $exe = (Resolve-Path "extracted/$binary").Path
          $database = Join-Path (Resolve-Path smoke).Path 'compos.sqlite'
          $process = Start-Process -FilePath $exe -ArgumentList @('-bind', "127.0.0.1:$port", '-database', $database) -PassThru -RedirectStandardOutput smoke/stdout.log -RedirectStandardError smoke/stderr.log
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw "server exited: $(Get-Content smoke/stderr.log -Raw)" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/v1/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$healthy) { throw "server did not become healthy: $(Get-Content smoke/stderr.log -Raw)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.WaitForExit()
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composd-candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        shell: sh
        run: |
          set -eu
          cd dist
          test "$(find . -name 'composd-*.source' | wc -l | tr -d ' ')" -eq 6
          for source in composd-*.source; do
            test "$(tr -d '\r\n' < "$source")" = "$GITHUB_SHA"
          done
          printf '%s\n' "$GITHUB_SHA" > SOURCE_SHA
          cat composd-*.sha256 | sort -k 2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
          sha256sum -c SHA256SUMS
          rm composd-*.sha256 composd-*.source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composd-candidate
          path: dist/*
          if-no-files-found: error
