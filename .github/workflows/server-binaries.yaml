name: verify server binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag at this main commit (empty for candidate only)
        type: string
      test_run:
        description: Successful test compos run ID for this commit
        type: string
      ghcr_run:
        description: Successful GHCR verification run ID for this commit
        type: string
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/server/**'
      - 'internal/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_LICENSES.txt'
      - '.github/workflows/server-binaries.yaml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "composd-$env:GOOS-$env:GOARCH"
          $binary = if ($env:GOOS -eq 'windows') { 'composd.exe' } else { 'composd' }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -ne $env:GITHUB_SHA) { throw 'checkout does not match workflow SHA' }
          New-Item -ItemType Directory -Path package, dist | Out-Null
          go build -trimpath -ldflags='-s -w' -o "package/$binary" ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt package/
          Get-Item package, package/* | ForEach-Object { $_.LastWriteTimeUtc = [DateTime]::new(2000, 1, 1, 0, 0, 0, [DateTimeKind]::Utc) }
          if ($env:GOOS -eq 'windows') {
            $archive = "$name.zip"
            Compress-Archive -Path package/* -DestinationPath "dist/$archive"
          } else {
            $archive = "$name.tar.gz"
            tar -czf "dist/$archive" -C package .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
          "$((Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower())  $archive" | Set-Content -Encoding ascii "dist/$name.sha256"
          $source | Set-Content -Encoding ascii "dist/$name.source"
      - name: Smoke test extracted archive
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "composd-$env:GOOS-$env:GOARCH"
          $binary = if ($env:GOOS -eq 'windows') { 'composd.exe' } else { 'composd' }
          New-Item -ItemType Directory -Path extracted, smoke | Out-Null
          if ($env:GOOS -eq 'windows') {
            Expand-Archive "dist/$name.zip" extracted
          } else {
            tar -xzf "dist/$name.tar.gz" -C extracted
            if ($LASTEXITCODE -ne 0) { throw 'archive extraction failed' }
          }
          foreach ($file in $binary, 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.txt') {
            if (!(Test-Path "extracted/$file")) { throw "archive missing $file" }
          }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $exe = (Resolve-Path "extracted/$binary").Path
          $root = (Resolve-Path smoke).Path
          $url = "http://127.0.0.1:$port"
          foreach ($backend in 'sqlite', 'rhiza') {
            $storage = if ($backend -eq 'sqlite') { @('-database', "$root/compos.sqlite") } else { @('-rhiza-data', "$root/rhiza") }
            $workspace = @{ name = 'Smoke'; key = 'smoke'; idempotency_key = 'smoke-workspace' } | ConvertTo-Json
            for ($attempt = 0; $attempt -lt 2; $attempt++) {
              $process = Start-Process -FilePath $exe -ArgumentList (@('-bind', "127.0.0.1:$port") + $storage) -PassThru -RedirectStandardOutput "$root/$backend-$attempt.out" -RedirectStandardError "$root/$backend-$attempt.err"
              try {
                $healthy = $false
                for ($i = 0; $i -lt 60; $i++) {
                  if ($process.HasExited) { throw "server exited: $(Get-Content "$root/$backend-$attempt.err" -Raw)" }
                  try {
                    $response = Invoke-WebRequest -Uri "$url/api/v1/health" -TimeoutSec 2
                    if ($response.StatusCode -eq 200) { $healthy = $true; break }
                  } catch { Start-Sleep -Seconds 1 }
                }
                if (!$healthy) { throw "$backend server did not become healthy" }
                $created = Invoke-RestMethod -Method Post -Uri "$url/api/v1/workspaces" -ContentType 'application/json' -Body $workspace
                if ($attempt -eq 0) {
                  if (!$created.data.created -or !$created.data.id) { throw "$backend workspace was not created" }
                  $id = $created.data.id
                  $command = @{ command_id = 'smoke-command'; idempotency_key = 'smoke-command'; workspace_id = $id; requested_actor = @{ type = 'user'; id = 'smoke' }; command_type = 'object_type.define'; target = @{ aggregate_type = 'object_type'; aggregate_id = $null }; preconditions = @(); payload = @{ key = 'orders'; singular = 'Order'; plural = 'Orders'; field_schema = @{ type = 'object' } }; causation = @{ source = 'api'; attempt_id = $null; event_id = $null } } | ConvertTo-Json -Depth 10
                  $result = Invoke-RestMethod -Method Post -Uri "$url/api/v1/kernel/commands" -ContentType 'application/json' -Body $command
                  if ($result.outcome -ne 'applied') { throw "$backend command was not applied" }
                } elseif ($created.data.created -or $created.data.id -ne $id -or $created.data.status -ne 'duplicate') {
                  throw "$backend workspace did not survive restart"
                }
                $events = Invoke-RestMethod -Uri "$url/api/v1/workspaces/$id/projection/events?after=0&limit=10"
                if (!($events.events | Where-Object { $_.workspace_id -eq $id -and $_.event_type -eq 'object_type.defined' })) { throw "$backend persisted event missing" }
              } finally {
                if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
                $process.WaitForExit()
              }
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composd-candidate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        shell: sh
        run: |
          sh scripts/release/server-binary-checksums.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composd-candidate
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: composd-candidate
          path: dist
      - name: Verify release gates and publish
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TEST_RUN: ${{ inputs.test_run }}
          GHCR_RUN: ${{ inputs.ghcr_run }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          check_tag() {
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
            type=$(printf '%s' "$ref" | jq -r .object.type)
            sha=$(printf '%s' "$ref" | jq -r .object.sha)
            if [ "$type" = tag ]; then
              ref=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
              type=$(printf '%s' "$ref" | jq -r .object.type)
              sha=$(printf '%s' "$ref" | jq -r .object.sha)
            fi
            test "$type" = commit && test "$sha" = "$GITHUB_SHA"
          }
          check_tag
          for run in "$TEST_RUN" "$GHCR_RUN"; do
            case "$run" in ''|*[!0-9]*) exit 1;; esac
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN" | jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .head_branch == "main" and .event == "push" and .path == ".github/workflows/test.yaml" and .status == "completed" and .conclusion == "success"' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GHCR_RUN" | jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .path == ".github/workflows/server-ghcr.yaml" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GHCR_RUN/jobs?per_page=100" | jq -e '[.jobs[] | select(.name == "verify" or .name == "recovery") | select(.conclusion == "success") | .name] | unique | sort == ["recovery", "verify"]' > /dev/null
          test "$(cat dist/SOURCE_SHA)" = "$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" dist/composd-*.tar.gz dist/composd-*.zip dist/SHA256SUMS dist/SOURCE_SHA
          check_tag
          gh release edit "$RELEASE_TAG" --draft=false
